<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title> 3D Weather</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Inter, Arial, sans-serif;
    background: #07111f;
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
}

/* =========================
   3D BACKGROUND
========================= */

#scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
}

.background-overlay {
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(50,130,255,.25),
            transparent 40%
        ),
        linear-gradient(
            180deg,
            rgba(4,18,40,.2),
            rgba(3,9,20,.9)
        );
}

/* =========================
   APP
========================= */

.app {
    width: min(1200px, 94%);
    margin: auto;
    padding: 35px 0 60px;
}

/* =========================
   NAVBAR
========================= */

.navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 30px;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -1px;
}

.logo span {
    color: #68b5ff;
}

.search-box {
    display: flex;
    gap: 10px;
}

.search-box input {
    width: 260px;
    padding: 13px 18px;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 30px;
    background: rgba(255,255,255,.09);
    color: white;
    outline: none;
    backdrop-filter: blur(20px);
}

.search-box input::placeholder {
    color: rgba(255,255,255,.55);
}

.search-box button {
    border: none;
    border-radius: 50%;
    width: 45px;
    height: 45px;
    background: rgba(255,255,255,.12);
    color: white;
    cursor: pointer;
    font-size: 18px;
}

/* =========================
   GLASS CARD
========================= */

.glass {
    background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.14);
    box-shadow:
        0 25px 70px rgba(0,0,0,.25),
        inset 0 1px 1px rgba(255,255,255,.12);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
}

/* =========================
   HERO
========================= */

.hero {
    min-height: 430px;
    border-radius: 35px;
    padding: 35px;
    position: relative;
    overflow: hidden;
}

.hero::after {
    content: "";
    position: absolute;
    width: 400px;
    height: 400px;
    background: rgba(65,160,255,.12);
    filter: blur(80px);
    border-radius: 50%;
    right: -100px;
    top: -100px;
}

.location {
    position: relative;
    z-index: 2;
}

.location h2 {
    font-size: 25px;
}

.location p {
    color: rgba(255,255,255,.6);
    margin-top: 6px;
}

.weather-main {
    margin-top: 50px;
    position: relative;
    z-index: 2;
}

.temperature {
    font-size: clamp(80px, 12vw, 140px);
    font-weight: 200;
    letter-spacing: -8px;
}

.condition {
    font-size: 25px;
    margin-top: -10px;
}

.high-low {
    color: rgba(255,255,255,.65);
    margin-top: 10px;
}

/* =========================
   WEATHER ORB
========================= */

.weather-orb {
    position: absolute;
    right: 9%;
    top: 70px;
    width: 230px;
    height: 230px;
    border-radius: 50%;
    background:
        radial-gradient(
            circle at 35% 30%,
            #fff,
            #ffe66b 20%,
            #ffad31 50%,
            rgba(255,150,20,.1) 70%
        );

    box-shadow:
        0 0 40px rgba(255,190,70,.7),
        0 0 100px rgba(255,160,30,.35);

    animation: floating 5s ease-in-out infinite;
}

@keyframes floating {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-18px);
    }

}

/* =========================
   STATS
========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 15px;
    margin-top: 20px;
}

.stat {
    padding: 20px;
    border-radius: 22px;
}

.stat-title {
    color: rgba(255,255,255,.55);
    font-size: 13px;
}

.stat-value {
    font-size: 22px;
    margin-top: 8px;
}

/* =========================
   FORECAST
========================= */

.section {
    margin-top: 20px;
    padding: 25px;
    border-radius: 28px;
}

.section-title {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

.section-title h3 {
    font-size: 19px;
}

.forecast {
    display: flex;
    gap: 12px;
    overflow-x: auto;
}

.forecast::-webkit-scrollbar {
    height: 4px;
}

.forecast-card {
    min-width: 105px;
    padding: 18px 12px;
    text-align: center;
    border-radius: 20px;
    background: rgba(255,255,255,.07);
    transition: .3s;
}

.forecast-card:hover {
    transform: translateY(-7px);
    background: rgba(255,255,255,.13);
}

.forecast-time {
    color: rgba(255,255,255,.6);
    font-size: 13px;
}

.weather-icon {
    font-size: 32px;
    margin: 13px 0;
}

.forecast-temp {
    font-size: 18px;
    font-weight: 600;
}

/* =========================
   LOADING
========================= */

.loading {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.6);
    backdrop-filter: blur(10px);
    z-index: 20;
}

.loader {
    width: 45px;
    height: 45px;
    border: 4px solid rgba(255,255,255,.2);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}

/* =========================
   MOBILE
========================= */

@media(max-width:800px) {

    .navbar {
        flex-direction: column;
        gap: 20px;
        align-items: stretch;
    }

    .search-box input {
        flex: 1;
        width: auto;
    }

    .hero {
        min-height: 600px;
    }

    .weather-orb {
        width: 160px;
        height: 160px;
        right: 50%;
        transform: translateX(50%);
        top: 270px;
    }

    .weather-main {
        margin-top: 40px;
    }

    .temperature {
        font-size: 90px;
    }

    .stats {
        grid-template-columns: repeat(2,1fr);
    }

}

</style>
</head>

<body>

<canvas id="scene"></canvas>

<div class="background-overlay"></div>

<div class="loading" id="loading">
    <div class="loader"></div>
</div>

<main class="app">

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            Atmos<span>3D</span>
        </div>

        <div class="search-box">

            <input
                id="cityInput"
                type="text"
                placeholder="Search city..."
            >

            <button onclick="searchCity()">
                🔍
            </button>

        </div>

    </nav>


    <!-- HERO -->

    <section class="hero glass">

        <div class="location">

            <h2 id="location">
                Hyderabad, India
            </h2>

            <p id="date">
                Loading...
            </p>

        </div>


        <div class="weather-main">

            <div class="temperature">

                <span id="temperature">
                    --°
                </span>

            </div>

            <div class="condition" id="condition">
                Loading weather...
            </div>

            <div class="high-low">

                H: <span id="high">--</span>
                &nbsp;&nbsp;
                L: <span id="low">--</span>

            </div>

        </div>


        <div class="weather-orb"></div>

    </section>


    <!-- STATS -->

    <section class="stats">

        <div class="stat glass">

            <div class="stat-title">
                💧 Humidity
            </div>

            <div
                class="stat-value"
                id="humidity"
            >
                --%
            </div>

        </div>


        <div class="stat glass">

            <div class="stat-title">
                💨 Wind
            </div>

            <div
                class="stat-value"
                id="wind"
            >
                -- km/h
            </div>

        </div>


        <div class="stat glass">

            <div class="stat-title">
                ☀️ UV Index
            </div>

            <div
                class="stat-value"
                id="uv"
            >
                --
            </div>

        </div>


        <div class="stat glass">

            <div class="stat-title">
                🌡️ Feels Like
            </div>

            <div
                class="stat-value"
                id="feels"
            >
                --°
            </div>

        </div>

    </section>


    <!-- HOURLY -->

    <section class="section glass">

        <div class="section-title">

            <h3>
                Hourly Forecast
            </h3>

            <span>
                Today
            </span>

        </div>

        <div
            class="forecast"
            id="hourly"
        >
        </div>

    </section>


    <!-- 7 DAY -->

    <section class="section glass">

        <div class="section-title">

            <h3>
                7-Day Forecast
            </h3>

            <span>
                This Week
            </span>

        </div>

        <div
            class="forecast"
            id="daily"
        >
        </div>

    </section>

</main>


<script>

/* =========================================
   THREE.JS 3D SCENE
========================================= */

let scene;
let camera;
let renderer;

let particles = [];

function init3D() {

    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );

    camera.position.z = 5;


    renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById("scene"),
        alpha: true,
        antialias: true
    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio,2)
    );


    /* STAR PARTICLES */

    const geometry =
        new THREE.BufferGeometry();

    const positions = [];

    for(let i=0;i<1800;i++){

        positions.push(
            (Math.random() - .5) * 20,
            (Math.random() - .5) * 12,
            (Math.random() - .5) * 15
        );

    }

    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            positions,
            3
        )
    );


    const material =
        new THREE.PointsMaterial({

            color: 0xffffff,
            size: .025,
            transparent: true,
            opacity: .7

        });


    const stars =
        new THREE.Points(
            geometry,
            material
        );

    scene.add(stars);

    particles.push(stars);


    animate3D();
}


function animate3D(){

    requestAnimationFrame(animate3D);


    particles.forEach(
        particle => {

            particle.rotation.y += .00025;
            particle.rotation.x += .00005;

        }
    );


    renderer.render(
        scene,
        camera
    );
}


window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


init3D();


/* =========================================
   WEATHER
========================================= */

let currentUnit = "C";

let currentWeather = null;


const weatherCodes = {

    0: ["Clear Sky","☀️"],
    1: ["Mainly Clear","🌤️"],
    2: ["Partly Cloudy","⛅"],
    3: ["Overcast","☁️"],

    45: ["Fog","🌫️"],
    48: ["Fog","🌫️"],

    51: ["Light Drizzle","🌦️"],
    53: ["Drizzle","🌦️"],
    55: ["Heavy Drizzle","🌧️"],

    61: ["Light Rain","🌦️"],
    63: ["Rain","🌧️"],
    65: ["Heavy Rain","🌧️"],

    71: ["Light Snow","🌨️"],
    73: ["Snow","❄️"],
    75: ["Heavy Snow","❄️"],

    80: ["Rain Showers","🌦️"],
    81: ["Rain Showers","🌧️"],
    82: ["Heavy Showers","🌧️"],

    95: ["Thunderstorm","⛈️"],
    96: ["Thunderstorm","⛈️"],
    99: ["Thunderstorm","⛈️"]

};


function showLoading(state){

    document.getElementById(
        "loading"
    ).style.display =
        state ? "flex" : "none";

}


/* =========================================
   GET WEATHER
========================================= */

async function getWeather(
    latitude,
    longitude,
    cityName
){

    try {

        showLoading(true);


        const url =
        `https://api.open-meteo.com/v1/forecast?` +

        `latitude=${latitude}` +

        `&longitude=${longitude}` +

        `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m` +

        `&hourly=temperature_2m,weather_code` +

        `&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max` +

        `&timezone=auto`;


        const response =
            await fetch(url);


        const data =
            await response.json();


        currentWeather = data;


        updateUI(
            data,
            cityName
        );


    }

    catch(error){

        console.error(error);

        alert(
            "Unable to load weather data."
        );

    }

    finally {

        showLoading(false);

    }

}


/* =========================================
   UPDATE UI
========================================= */

function updateUI(
    data,
    cityName
){

    const current =
        data.current;

    const daily =
        data.daily;

    const hourly =
        data.hourly;


    const weather =
        weatherCodes[
            current.weather_code
        ] ||
        ["Unknown","🌡️"];


    document.getElementById(
        "location"
    ).textContent =
        cityName;


    document.getElementById(
        "date"
    ).textContent =
        new Date().toLocaleString(
            undefined,
            {
                weekday:"long",
                month:"short",
                day:"numeric",
                hour:"numeric",
                minute:"2-digit"
            }
        );


    document.getElementById(
        "temperature"
    ).textContent =
        Math.round(
            current.temperature_2m
        ) + "°";


    document.getElementById(
        "condition"
    ).textContent =
        weather[1] +
        " " +
        weather[0];


    document.getElementById(
        "high"
    ).textContent =
        Math.round(
            daily.temperature_2m_max[0]
        ) + "°";


    document.getElementById(
        "low"
    ).textContent =
        Math.round(
            daily.temperature_2m_min[0]
        ) + "°";


    document.getElementById(
        "humidity"
    ).textContent =
        current.relative_humidity_2m +
        "%";


    document.getElementById(
        "wind"
    ).textContent =
        Math.round(
            current.wind_speed_10m
        ) +
        " km/h";


    document.getElementById(
        "uv"
    ).textContent =
        daily.uv_index_max[0];


    document.getElementById(
        "feels"
    ).textContent =
        Math.round(
            current.apparent_temperature
        ) +
        "°";


    updateHourly(
        hourly
    );


    updateDaily(
        daily
    );


    update3DWeather(
        current.weather_code
    );

}


/* =========================================
   HOURLY
========================================= */

function updateHourly(
    hourly
){

    const container =
        document.getElementById(
            "hourly"
        );


    container.innerHTML = "";


    const now =
        new Date();


    for(let i=0;i<12;i++){

        const time =
            new Date(
                hourly.time[i]
            );


        const code =
            hourly.weather_code[i];


        const weather =
            weatherCodes[code] ||
            ["","🌡️"];


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "forecast-card";


        card.innerHTML = `

            <div class="forecast-time">

                ${
                    i === 0
                    ? "Now"
                    : time.toLocaleTimeString(
                        [],
                        {
                            hour:"numeric"
                        }
                    )
                }

            </div>

            <div class="weather-icon">
                ${weather[1]}
            </div>

            <div class="forecast-temp">
                ${Math.round(
                    hourly.temperature_2m[i]
                )}°
            </div>

        `;


        container.appendChild(
            card
        );

    }

}


/* =========================================
   DAILY
========================================= */

function updateDaily(
    daily
){

    const container =
        document.getElementById(
            "daily"
        );


    container.innerHTML = "";


    for(let i=0;i<7;i++){

        const date =
            new Date(
                daily.time[i]
            );


        const weather =
            weatherCodes[
                daily.weather_code[i]
            ] ||
            ["","🌡️"];


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "forecast-card";


        card.innerHTML = `

            <div class="forecast-time">

                ${
                    i === 0
                    ? "Today"
                    : date.toLocaleDateString(
                        [],
                        {
                            weekday:"short"
                        }
                    )
                }

            </div>

            <div class="weather-icon">

                ${weather[1]}

            </div>

            <div class="forecast-temp">

                ${Math.round(
                    daily.temperature_2m_max[i]
                )}°

            </div>

            <div
                style="
                    color:rgba(255,255,255,.5);
                    margin-top:5px;
                "
            >

                ${Math.round(
                    daily.temperature_2m_min[i]
                )}°

            </div>

        `;


        container.appendChild(
            card
        );

    }

}


/* =========================================
   CITY SEARCH
========================================= */

async function searchCity(){

    const input =
        document.getElementById(
            "cityInput"
        );


    const city =
        input.value.trim();


    if(!city){

        return;

    }


    try {

        showLoading(true);


        const response =
            await fetch(
                `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`
            );


        const data =
            await response.json();


        if(!data.results){

            alert(
                "City not found."
            );

            return;

        }


        const result =
            data.results[0];


        const cityName =
            `${result.name}, ${result.country}`;


        await getWeather(
            result.latitude,
            result.longitude,
            cityName
        );


    }

    catch(error){

        console.error(error);

        alert(
            "Search failed."
        );

    }

    finally {

        showLoading(false);

    }

}


/* ENTER KEY SEARCH */

document
.getElementById("cityInput")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            searchCity();

        }

    }
);


/* =========================================
   AUTOMATIC LOCATION
========================================= */

async function loadDefaultWeather(){

    /*
        Hyderabad coordinates
        Used as fallback.
    */

    await getWeather(
        17.3850,
        78.4867,
        "Hyderabad, India"
    );

}


loadDefaultWeather();


/* =========================================
   CHANGE 3D ENVIRONMENT
========================================= */

function update3DWeather(
    weatherCode
){

    /*
        Clear
        0-3

        Rain
        51-67, 80-82

        Storm
        95-99
    */


    let color;


    if(weatherCode >= 95){

        color = 0x111c36;

    }

    else if(
        weatherCode >= 51 &&
        weatherCode <= 82
    ){

        color = 0x152b45;

    }

    else {

        color = 0x0b1f3a;

    }


    scene.background =
        new THREE.Color(
            color
        );

}

</script>

</body>
</html>
